[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "escna-mechanisms"
version = "0.1.0"
description = "Core mechanism-study implementation of the ESCNA multi-agent deliberation framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests==2.32.5"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
